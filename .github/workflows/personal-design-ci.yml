name: Personal Design CI (Mac renderer)

on:
  pull_request:
    branches: [main]
  push:
    branches: [design/shadcn-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-design-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Bundle React renderer
        run: npm run build:renderer
      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck
      - name: Run full Jest suite
        run: npm test -- --runInBand
